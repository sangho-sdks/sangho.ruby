name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Lint
        run: bundle exec rubocop lib/ spec/

      # Uniquement les tests unitaires : pas de clé d'API en CI, les tests
      # d'intégration se lancent en local.
      - name: Tests
        run: bundle exec rspec --exclude-pattern "spec/integration/**/*_spec.rb"
