# .github/workflows/release.yml
name: Release SDK
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de version (current = publie la version actuelle sans la changer)"
        required: true
        default: current
        type: choice
        options: [current, patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bundle exec rubocop lib/ spec/
      - run: bundle exec rspec --exclude-pattern "spec/integration/**/*_spec.rb"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump de version
        if: inputs.bump != 'current'
        run: |
          current=$(ruby -Ilib -e "require 'sangho/version'; print Sangho::VERSION")
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          sed -i "s/VERSION = '.*'/VERSION = '${major}.${minor}.${patch}'/" lib/sangho/version.rb
          git add lib/sangho/version.rb
          git commit -m "chore: release v${major}.${minor}.${patch}"

      - name: Tag + push
        run: |
          version=$(ruby -Ilib -e "require 'sangho/version'; print Sangho::VERSION")
          git tag -a "v${version}" -m "Release v${version}"
          git push origin main "v${version}"

      - name: Build + publish RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem build sangho.gemspec
          gem push sangho-*.gem
