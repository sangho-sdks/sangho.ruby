AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'spec/integration/**/*'   # tests contre l'API réelle (hors CI)

Layout/LineLength:
  Max: 130

Metrics/ClassLength:
  Max: 160
Metrics/MethodLength:
  Max: 25
Metrics/AbcSize:
  Max: 30
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Naming/AccessorMethodName:
  Exclude:
    - 'lib/sangho/resources/payment_methods.rb'   # set_default : nom de l'action de l'API

Style/Documentation:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: single_quotes

Gemspec/DevelopmentDependencies:
  Enabled: false   # les dépendances de développement restent dans le gemspec
